image: ocaml/opam:debian-12-ocaml-5.2

stages:
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - _opam/

before_script:
  # GitLab checks out the project as root while this image executes as opam.
  # opam reads package metadata through `git ls-files`, which Git otherwise
  # rejects as an unsafe repository ownership transition.
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  - opam update
  - eval "$(opam env)"
  - opam install . --deps-only --with-test --yes

test:
  stage: test
  script:
    - eval "$(opam env)"
    - dune build @all
    - dune test
