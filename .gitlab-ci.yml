# The coverage tool (bisect_ppx_ng) requires OCaml >= 5.3.
image: ocaml/opam:debian-12-ocaml-5.4

stages:
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - _opam/

before_script:
  # GitLab checks out the project as root while this image executes as opam.
  # opam reads package metadata through `git ls-files`, which Git otherwise
  # rejects as an unsafe repository ownership transition.
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  - opam update
  - eval "$(opam env)"
  - opam install . --deps-only --with-test --yes
  - opam install bisect_ppx_ng --yes

test:
  stage: test
  variables:
    # The unprivileged runner cannot execute the root-only bridge/session
    # setup tests, so its gate is lower than the privileged Forgejo job.
    COVERAGE_MIN: '85'
  script:
    - eval "$(opam env)"
    - dune build @all
    - ./contrib/check-coverage.sh
